name: Build KPL GAME
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run checkout
      - run: npm run install:games
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: kplgame-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kplgame-reports
          path: reports/
